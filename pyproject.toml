[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsai-hybrid-starter"
version = "0.1.0"
description = "Evidence-first NSAI deployment foundation (clean-room starter)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1",
  "starlette==1.3.1",
  "uvicorn==0.48.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "redis==8.1.0",
  "authlib==1.9.1",
  "itsdangerous==2.2.0",
  "psycopg[binary]==3.2.12",
  "pypdf==6.20.1",
  "fonttools==4.67.0",
  "defusedxml==0.7.1",
  "python-multipart==0.0.31"
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
