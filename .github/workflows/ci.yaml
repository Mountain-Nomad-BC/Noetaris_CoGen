name: NSAI locked CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.15', '3.14.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 resolved 2026-10-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5 resolved 2026-10-14
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed hash-locked dependency closures
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          mkdir -p evidence/implementation
          cp docs/dependencies/toolchain-lock-provenance.json evidence/implementation/toolchain-lock-provenance.json
          python scripts/lock_dev_tools.py
      - name: Unit contracts and static boundaries
        run: |
          python -m compileall -q src scripts
          python -m pytest -q
          python scripts/validate_compose_security.py
          python scripts/release_audit.py .
      - name: Baseline Compose syntax only
        run: docker compose config --quiet
      - name: Frontend contracts and production build
        working-directory: frontend/noetaris
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Compose profile syntax only (no model runtime)
        env:
          NSAI_GGUF_PATH: /tmp/nsai-compose-syntax-only.gguf
        shell: bash
        run: |
          python scripts/validate_deployment_target.py baseline
          python scripts/validate_deployment_target.py semantic
          python scripts/validate_deployment_target.py cpu