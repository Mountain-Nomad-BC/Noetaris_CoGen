worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 26m;
    large_client_header_buffers 2 16k;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    map $uri $route_family {
        ~^/auth/ authentication;
        ~^/v1/ authenticated-api;
        ~^/assets/ public-static;
        default site;
    }
    # No query strings, credentials, source IDs, filenames or client addresses.
    log_format operations escape=json '{"route":"$route_family","status":$status,"seconds":$request_time,"upstream_seconds":"$upstream_response_time","upstream":"$upstream_addr","request_id":"$request_id"}';
    access_log /dev/stdout operations;
    upstream nsai_api {
        zone nsai_api 64k;
        least_conn;
        server api:8787 resolve;
        keepalive 16;
    }
    # Empty unless an explicit local TLS overlay supplies a server definition.
    include /etc/nginx/nsai-optional/*.conf;
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        location / {
            proxy_pass http://nsai_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            # Replaying POST/upload/workflow actions on a second node is unsafe.
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 300s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }
    }
}
