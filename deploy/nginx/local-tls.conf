# Local loopback TLS only. Public Cloud Run terminates TLS separately.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
ssl_session_cache shared:NSAI_LOCAL_TLS:1m;
server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /run/secrets/local_tls_certificate;
    ssl_certificate_key /run/secrets/local_tls_private_key;
    return 444;
}
server {
    listen 8443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /run/secrets/local_tls_certificate;
    ssl_certificate_key /run/secrets/local_tls_private_key;
    location / {
        proxy_pass http://nsai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
    }
}
