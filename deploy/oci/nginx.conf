# Template: replace only the owned API hostname after domain/TLS commissioning.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 26m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  map $uri $route_family { ~^/auth/ authentication; ~^/v1/ authenticated-api; default health; }
  log_format redacted escape=json '{"route":"$route_family","status":$status,"seconds":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout redacted;
  upstream nsai_api { zone nsai_api 64k; server api:8787 resolve; keepalive 16; }
  server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
  }
  server {
    listen 8443 ssl;
    server_name api.REPLACE_OWNED_DOMAIN;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/(auth/|v1/|healthz$|readyz$) {
      proxy_pass http://nsai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream off;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 300s;
      proxy_send_timeout 30s;
    }
    location / { return 404; }
  }
}
