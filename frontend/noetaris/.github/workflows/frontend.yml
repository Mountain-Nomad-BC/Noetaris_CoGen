name: Frontend source and production build
on:
  push:
    paths: ['src/**', 'package.json', 'vite.config.js', 'scripts/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'package.json', 'vite.config.js', 'scripts/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
