worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 access_log off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 26m;
 client_header_timeout 10s;
 client_body_timeout 15s;
 resolver 127.0.0.11 valid=10s ipv6=off;
 map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
 include /etc/nginx/noetaris-optional/*.conf;
 server { listen 8080 default_server; server_name _; return 444; }
 server {
  listen 8080;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-store" always;
  location ~ ^/(v1|auth)(/|$)|^/(healthz|readyz)$ {
   set $backend api:8787;
   proxy_pass http://$backend;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_next_upstream off;
   proxy_read_timeout 300s;
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_cache off;
  }
  # Public pinned renderer assets only; original source bytes use /v1 authorization.
  location ~ ^/pdf-runtime/(?<pdf_asset>pdfjs/(pdf(\.worker)?\.mjs|standard_fonts/[A-Za-z0-9_-]+\.(pfb|ttf)|LICENSE|provenance\.json)|pdf-canvas\.mjs|pdf-quotes\.mjs)$ {
   set $pdf_backend api:8787;
   proxy_pass http://$pdf_backend/assets/$pdf_asset;
   proxy_set_header Host $host;
   proxy_set_header Cookie "";
   proxy_set_header Authorization "";
   proxy_next_upstream off;
   proxy_read_timeout 15s;
   proxy_cache off;
  }
  location /pdf-runtime/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
