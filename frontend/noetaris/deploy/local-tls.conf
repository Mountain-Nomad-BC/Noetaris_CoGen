# Loopback qualification TLS; supplied certificates only.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
server {
 listen 8443 ssl default_server;
 server_name _;
 ssl_certificate /run/secrets/local_tls_certificate;
 ssl_certificate_key /run/secrets/local_tls_private_key;
 return 444;
}
 server {
  listen 8443 ssl;
  ssl_certificate /run/secrets/local_tls_certificate;
  ssl_certificate_key /run/secrets/local_tls_private_key;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-store" always;
  location ~ ^/(v1|auth)(/|$)|^/(healthz|readyz)$ {
   set $backend api:8787;
   proxy_pass http://$backend;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_next_upstream off;
   proxy_read_timeout 300s;
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_cache off;
  }
  # Public pinned renderer assets only; original source bytes use /v1 authorization.
  location ~ ^/pdf-runtime/(?<pdf_asset>pdfjs/(pdf(\.worker)?\.mjs|standard_fonts/[A-Za-z0-9_-]+\.(pfb|ttf)|LICENSE|provenance\.json)|pdf-canvas\.mjs|pdf-quotes\.mjs)$ {
   set $pdf_backend api:8787;
   proxy_pass http://$pdf_backend/assets/$pdf_asset;
   proxy_set_header Host $host;
   proxy_set_header Cookie "";
   proxy_set_header Authorization "";
   proxy_next_upstream off;
   proxy_read_timeout 15s;
   proxy_cache off;
  }
  location /pdf-runtime/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
 }
